services:
  postgres:
    image: postgres:16-alpine
    container_name: fitwell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fitwell}
      POSTGRES_USER: ${DB_USER:-fitwell_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fitwell_secret}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fitwell_user} -d ${DB_NAME:-fitwell}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitwell-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fitwell}
      DB_USER: ${DB_USER:-fitwell_user}
      DB_PASSWORD: ${DB_PASSWORD:-fitwell_secret}
      UPLOAD_DIR: /app/uploads
      TRUSTED_PROXIES: 127.0.0.1,172.16.0.0/12,172.18.0.0/16
      ENABLE_DEV_SEED: "true"
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@fitwell.ma}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-AdminSecure2026!}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || java -cp app.jar com.fitwell.HealthCheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitwell-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  backend_uploads:
